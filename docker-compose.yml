services:
  mongo:
    image: mongo:7
    container_name: rosterup-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - rosterup-mongo-data:/data/db
    networks:
      - rosterup-network

  web:
    build: .
    container_name: rosterup-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/RUDatabase
      - JWT_SECRET=replace-with-a-long-random-string
    depends_on:
      - mongo
    networks:
      - rosterup-network

networks:
  rosterup-network:
    driver: bridge

volumes:
  rosterup-mongo-data:
