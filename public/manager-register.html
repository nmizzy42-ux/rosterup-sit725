<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterUp — Manager Registration</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/sign-in.css">
  <link rel="stylesheet" href="/style/manager-register.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">
      <a href="create-account.html" class="auth-back">
        <span class="material-icons">arrow_back</span> Back
      </a>

      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-box">R</div>
          <span class="auth-logo-text">RosterUp</span>
        </div>

        <h2>Register as Manager</h2>
        <p class="auth-subtitle">Set up your account to manage your team's shifts and approvals</p>

        <form class="auth-fields" id="managerRegisterForm">
          <div class="mr-row">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" required>
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" required>
            </div>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@email.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Create Account</button>
        </form>

        <div id="messageBox" class="alert-box hidden"></div>

        <p class="auth-footer-text">
          Already have an account? <a href="sign-in.html">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    document.getElementById('managerRegisterForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const messageBox = document.getElementById('messageBox');
      const submitBtn = document.getElementById('submitBtn');

      const first_name = document.getElementById('firstName').value.trim();
      const last_name = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Managers don't need a workplace invite code — they create the workplace themselves.
      const role = 'manager';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      messageBox.className = 'alert-box hidden';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ first_name, last_name, email, password, role })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          messageBox.textContent = 'Account created! Redirecting to sign in…';
          messageBox.className = 'alert-box alert-success';
          document.getElementById('password').value = '';
          setTimeout(() => { window.location.href = 'sign-in.html'; }, 1200);
        } else {
          messageBox.textContent = data.message || 'An error occurred during registration.';
          messageBox.className = 'alert-box alert-error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch (err) {
        console.error('Error handling manager registration:', err);
        messageBox.textContent = 'Connection error. Please confirm your database status.';
        messageBox.className = 'alert-box alert-error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
