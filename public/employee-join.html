<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Workplace | RosterUp</title>
    <!-- Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Base App Stylesheet -->
    <link rel="stylesheet" href="style/main.css">
    <!-- Screen Specific Stylesheet -->
    <link rel="stylesheet" href="style/employee-join.css">
</head>

<body>
    <div class="container valign-wrapper" style="min-height: 100vh;">
        <div class="ej-wrapper">
            <div class="card">
                <div class="card-content" style="padding: 2.5rem 2rem;">
                    <div class="ej-header">
                        <h2>Join Your Team</h2>
                        <p>Enter your credentials along with the workplace code shared by your supervisor.</p>
                    </div>

                    <form id="employeeJoinForm">
                        <div class="ej-row">
                            <div class="input-field">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" required>
                            </div>
                            <div class="input-field">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" required>
                            </div>
                        </div>

                        <div class="input-field">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="input-field">
                            <label for="password">Password</label>
                            <input type="password" id="password" required>
                        </div>

                        <div class="input-field">
                            <label for="inviteCode">Workplace Invite Code</label>
                            <input type="text" id="inviteCode" required>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-primary" style="margin-top: 1.5rem;">
                            Submit Request
                        </button>
                    </form>

                    <!-- Status Display Block -->
                    <div id="messageBox" class="alert-box hidden"></div>

                    <div class="ej-footer-text">
                        Already have an account? <a href="sign-in.html">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/scripts.js"></script>
    <script src="js/employee-join.js"></script>
</body>

</html>
